
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Addon Store Ultimate</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#e9ecf5;
}

.header{
background:#1d2390;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
font-weight:bold;
position:sticky;
top:0;
z-index:5;
}

.coins{
background:#3949db;
padding:10px 15px;
border-radius:20px;
font-size:18px;
}

.search{
padding:15px;
}

.search input{
width:100%;
padding:14px;
border-radius:14px;
border:2px solid #c9cee7;
font-size:16px;
box-sizing:border-box;
}

.daily{
margin:15px;
background:#00c853;
padding:15px;
border-radius:14px;
text-align:center;
font-weight:bold;
color:white;
}

.grid{
padding:15px;
display:grid;
gap:20px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 3px 15px rgba(0,0,0,.15);
animation:fade 3s infinite alternate;
}

@keyframes fade{
0%{opacity:1;}
100%{opacity:.75;}
}

.card img{
width:100%;
display:block;
}

.info{
padding:15px;
}

.name{
font-size:22px;
font-weight:bold;
color:#1d2390;
}

.price{
margin:10px 0;
color:#ff9800;
font-weight:bold;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#1d2390;
color:white;
font-size:17px;
font-weight:bold;
margin-top:10px;
}

.green{
background:#00c853 !important;
box-shadow:0 0 20px #00ff88;
}

#loginScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.loginBox{
background:#1d2390;
padding:25px;
border-radius:20px;
width:85%;
max-width:350px;
color:white;
}

.loginBox input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
box-sizing:border-box;
}

#adminBall{
position:fixed;
bottom:20px;
right:20px;
width:70px;
height:70px;
border-radius:50%;
background:#1d2390;
display:none;
justify-content:center;
align-items:center;
font-size:30px;
color:white;
z-index:1000;
animation:move 3s infinite;
}

@keyframes move{
0%{transform:translate(0,0);}
50%{transform:translate(-10px,10px);}
100%{transform:translate(0,0);}
}

#adminPanel{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
color:white;
z-index:1001;
padding:20px;
overflow:auto;
box-sizing:border-box;
}

.panel{
background:#111;
padding:20px;
border-radius:20px;
margin-top:20px;
}

#sorteados{
margin-top:15px;
font-size:18px;
color:#00ff88;
font-weight:bold;
}
</style>
</head>

<body>

<div id="loginScreen">
<div class="loginBox">

<h2>LOGIN</h2>

<input type="email" id="email" placeholder="Seu e-mail">

<input type="password" id="senha" placeholder="Sua senha">

<button onclick="entrar()">
ENTRAR
</button>

</div>
</div>

<div class="header">
<div>MC ADDON STORE</div>
<div class="coins" id="coins">🎉 100</div>
</div>

<div class="daily" onclick="dailyReward()">
🎁 RECOMPENSA DIÁRIA +25
</div>

<div class="search">
<input type="text" id="search" placeholder="🔍 Buscar addons e mods...">
</div>

<script>

let moedas = 100;

function atualizar(){
document.getElementById("coins").innerText = "🎉 " + moedas;
document.getElementById("admCoins").innerText = moedas;
}

function comprar(valor,btn,link){
if(moedas >= valor){
moedas -= valor;
atualizar();

btn.classList.add("green");
btn.innerText = "COMPRADO ✓";

setTimeout(()=>{
window.open(link,"_blank");
},1000);

} else {
alert("Sem moedas!");
}
}

function dailyReward(){
if(!localStorage.getItem("daily")){
moedas += 25;
localStorage.setItem("daily","ok");
alert("Você ganhou 25 moedas!");
atualizar();
} else {
alert("Você já pegou hoje!");
}
}

function entrar(){
let email=document.getElementById("email").value;
let senha=document.getElementById("senha").value;

if(email && senha){
localStorage.setItem("user",email);
document.getElementById("loginScreen").style.display="none";
alert("Login feito com sucesso!");
} else {
alert("Preencha tudo!");
}
}

function abrirADM(){
document.getElementById("adminPanel").style.display="block";
}

function fecharADM(){
document.getElementById("adminPanel").style.display="none";
}

document.getElementById("search").addEventListener("input",function(){
if(this.value === "ADM LOOK"){
document.body.style.background="black";

setTimeout(()=>{
document.body.style.background="#e9ecf5";
document.getElementById("adminBall").style.display="flex";
alert("Modo ADM ativado 👑");
},1000);
}
});

function sortear(){
let nomes=[
"Player_BR",
"SonicMaster",
"GodzillaKing",
"MineUser",
"KauanCraft",
"UltraPlayer"
];

let vencedor = nomes[Math.floor(Math.random()*nomes.length)];

document.getElementById("sorteados").innerHTML =
"🏆 " + vencedor + " ganhou 1000 moedas!";
}

atualizar();

</script>
